<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Document Register: Classes Demo</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1c2631;--soft:#5d6874;--line:#e2ded5;--tint:#f4f2ee;--navy:#1d3a52;--accent:#1f5f8b;--accent-soft:#e1ecf5;--ok:#23734a;--ok-soft:#dff2e7;--warn:#8f5a00;--warn-soft:#fbefd6;--bad:#a02f2f;--bad-soft:#f8e2e2;--mute:#7d8790;--mute-soft:#eceae5;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121518;--panel:#1a1f25;--ink:#e6e9ec;--soft:#9aa5b0;--line:#2b333c;--tint:#1e242b;--navy:#0f2232;--accent:#7fb3dd;--accent-soft:#1c2c3b;--ok:#7fd1a0;--ok-soft:#1b3326;--warn:#f0c270;--warn-soft:#3a2d13;--bad:#f09a9a;--bad-soft:#3b1f1f;--mute:#7d878f;--mute-soft:#262c33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121518;--panel:#1a1f25;--ink:#e6e9ec;--soft:#9aa5b0;--line:#2b333c;--tint:#1e242b;--navy:#0f2232;--accent:#7fb3dd;--accent-soft:#1c2c3b;--ok:#7fd1a0;--ok-soft:#1b3326;--warn:#f0c270;--warn-soft:#3a2d13;--bad:#f09a9a;--bad-soft:#3b1f1f;--mute:#7d878f;--mute-soft:#262c33;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 18px}
.brand{font-weight:700;font-size:16px;margin-right:auto}
.brand small{display:block;font-weight:500;opacity:.75;font-size:12px}
.who{display:flex;gap:8px;align-items:center;font-size:13px}
.who select{background:#2c4f6b;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 8px}
.who select option{color:#111}
.who .role{opacity:.8;font-size:12px}
.topbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 62px)}
@media (max-width:760px){.shell{grid-template-columns:1fr}.nav{display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.nav h4{width:100%}}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px}
.nav button{display:flex;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink);white-space:nowrap}
.nav button:hover{background:var(--tint)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav h4{margin:14px 12px 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
main{padding:22px clamp(14px,3vw,30px) 60px;min-width:0}
h1{font-size:24px;margin:0 0 4px;font-weight:650}
h2{font-size:17px;margin:24px 0 10px;font-weight:650}
h3{font-size:15px;margin:0 0 6px;font-weight:650}
.sub{color:var(--soft);margin:0 0 16px;max-width:75ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--soft)}
.small{font-size:13px}
.no{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--soft)}
.strong{font-weight:650}
.crumb{font-size:13px;color:var(--soft)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:6px 4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.t,select.t,textarea.t{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);width:100%;font-size:14px}
input.t[readonly]{background:var(--tint);font-family:ui-monospace,Consolas,monospace;font-weight:600}
textarea.t{min-height:64px;resize:vertical}
.field{display:grid;gap:4px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;font-weight:650}
.field .help{font-size:12.5px;color:var(--soft)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.infobox{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:8px 0 0;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.two,.three,.four{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.two,.three,.four{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-check{background:var(--accent-soft);color:var(--accent)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-old{background:var(--mute-soft);color:var(--mute)}
.p-none{background:var(--mute-soft);color:var(--soft)}
.cls{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:650;background:var(--tint);color:var(--soft);border:1px solid var(--line)}
.cls.controlled{color:var(--accent);border-color:var(--accent)}
.cls.periodic{color:var(--ok);border-color:var(--ok)}
.cls.record{color:var(--warn);border-color:var(--warn)}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--soft);margin-left:4px}
.tag.cur{border-color:var(--ok);color:var(--ok);font-weight:650}
.tag.lat{border-color:var(--accent);color:var(--accent);font-weight:650}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-weight:650;white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--tint)}
tr:last-child td{border-bottom:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--soft)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.bar{height:8px;background:var(--mute-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
/* Calendar cells for periodic series */
.cal td{padding:6px 4px;text-align:center}
.cell{width:100%;min-width:40px;border:0;border-radius:7px;padding:7px 0;font-size:12px;font-weight:650;cursor:pointer}
.cell:disabled{cursor:default}
.c-uploaded{background:var(--ok-soft);color:var(--ok)}
.c-late{background:var(--warn-soft);color:var(--warn)}
.c-missing{background:var(--bad-soft);color:var(--bad)}
.c-open{background:var(--accent-soft);color:var(--accent);outline:2px solid var(--accent);outline-offset:-2px}
.c-na{background:var(--mute-soft);color:var(--mute)}
.c-upcoming{background:transparent;color:var(--mute);border:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--soft);margin:10px 0}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg-uploaded::before{background:var(--ok-soft);outline:1px solid var(--ok)}
.lg-late::before{background:var(--warn-soft);outline:1px solid var(--warn)}
.lg-missing::before{background:var(--bad-soft);outline:1px solid var(--bad)}
.lg-open::before{background:var(--accent-soft);outline:2px solid var(--accent)}
.lg-na::before{background:var(--mute-soft)}
.lg-upcoming::before{background:transparent;outline:1px dashed var(--mute)}
/* Revisions */
.rev{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.rev:last-child{padding-bottom:0}
.rev .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--mute);background:var(--panel);margin-top:5px}
.rev.cur .dot{background:var(--ok);border-color:var(--ok)}
.rev.lat .dot{border-color:var(--accent)}
.rev .rt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rev .rm{font-size:13px;color:var(--soft);margin-top:2px}
.rev .rs{margin-top:6px;background:var(--tint);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.rev .ra{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tasks{display:grid;gap:8px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.task .th{font-size:13px;color:var(--soft)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.scrim{position:fixed;inset:0;background:rgba(15,22,30,.45);z-index:20;display:grid;place-items:center;padding:14px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:min(660px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px -24px rgba(0,0,0,.45)}
.modal h3{font-size:19px;margin:0 0 6px}
.stepline{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;font-size:13px;color:var(--soft)}
.stepline span{background:var(--tint);border-radius:999px;padding:3px 10px}
.drop{border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.log .l{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log .l:last-child{border-bottom:0}
.log .wt{color:var(--soft);font-size:13px}
pre.out{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Consolas,monospace;background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 0;overflow:auto}
footer{color:var(--soft);font-size:12.5px;margin-top:30px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Document Register<small>Classes demo. Nothing leaves this page.</small></div>
  <div class="who">
    <label for="me">Playing as</label>
    <select id="me" aria-describedby="meRole"></select>
    <span class="role" id="meRole"></span>
  </div>
  <button class="topbtn" data-a="reset">Start over</button>
</header>

<div class="shell">
  <nav class="nav" aria-label="Sections">
    <h4>Overview</h4>
    <button data-a="nav" data-v="dash">Dashboard</button>
    <h4>Documents</h4>
    <button data-a="nav" data-v="docs">All documents</button>
    <button data-a="nav" data-v="cal">Recurring (monthly)</button>
    <button data-a="nav" data-v="recs">Certificates and permits</button>
    <button data-a="nav" data-v="trans">Transmittal</button>
    <h4>Record</h4>
    <button data-a="nav" data-v="log">Activity</button>
  </nav>
  <main id="main"></main>
</div>

<div id="modalWrap"></div>
<div id="toastWrap"></div>

<script>
/* ================= Reference data ================= */
const KEY='dmsDemo.classes.v1';
const PEOPLE=['Sam','Priya','Tom','Mia'];
const ROLE={Sam:'Adds files',Priya:'Checker',Tom:'Approver',Mia:'Records lead (admin)'};
const ADMIN='Mia';
const REASONS=['Design change','Client comment','Vendor data','Error fix','Scope change','As-built'];
const PROJECTS=[{code:'U100',name:'Unit 100 Refinery',stream:true},{code:'TF7',name:'Tank Farm TF-7',stream:true},{code:'NEW1',name:'New Substation SS-9',stream:false}];
const LEAVES=['EPC/01 Project Management',
 'EPC/02 Engineering/02.1 Process','EPC/02 Engineering/02.2 Piping','EPC/02 Engineering/02.3 Electrical',
 'EPC/02 Engineering/02.4 Instrumentation & Control','EPC/02 Engineering/02.5 Civil & Structural',
 'EPC/03 Procurement/03.2 Purchase Orders','EPC/04 Construction/04.1 Method Statements',
 'Operations/01 Manuals','Operations/02 SOPs','Operations/03 Maintenance','Operations/04 Permits','Operations/05 Reports','Operations/06 Certificates'];
/* Each type has exactly one class. The class decides the workflow. */
const TYPES=[
 {c:'PID',l:'P&ID',cls:'controlled',f:'EPC/02 Engineering/02.1 Process'},
 {c:'ISO',l:'Piping isometric',cls:'controlled',f:'EPC/02 Engineering/02.2 Piping'},
 {c:'SLD',l:'Single line diagram',cls:'controlled',f:'EPC/02 Engineering/02.3 Electrical'},
 {c:'MS',l:'Method statement',cls:'controlled',f:'EPC/04 Construction/04.1 Method Statements'},
 {c:'SOP',l:'Startup procedure',cls:'controlled',f:'Operations/02 SOPs'},
 {c:'MAN',l:'Operations manual',cls:'controlled',f:'Operations/01 Manuals'},
 {c:'MNT',l:'Monthly maintenance check',cls:'periodic',f:'Operations/03 Maintenance'},
 {c:'RPT',l:'Monthly operations report',cls:'periodic',f:'Operations/05 Reports'},
 {c:'CERT',l:'Certificate or inspection',cls:'record',f:'Operations/06 Certificates'},
 {c:'PTW',l:'Permit to work template',cls:'record',f:'Operations/04 Permits'}];
const TYPE=c=>TYPES.find(t=>t.c===c);
const PATH=f=>f.split('/').join(' › ');
const GROUP=f=>f.split('/')[0];
const CLS_LABEL={controlled:'Controlled (approved)',periodic:'Recurring (monthly)',record:'Certificate (expiry)'};
const CLS_HELP={controlled:'Upload, check and approve. Revisions. One Current version.',periodic:'Upload each period on time. No approval. Shows Late or Missing.',record:'Upload with an expiry date. Renew before it expires. No approval.'};
const DAY=()=>new Date().toISOString().slice(0,10);
const NOW_KEY=()=>DAY().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmtT=t=>new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const rev=o=>Object.assign({status:'Approved',date:'2026-02-03',by:'Sam',reason:'Design change',summary:'',checker:'',approver:'',checkedBy:'',approvedBy:'',returnNote:'',file:''},o);
const gapRev=()=>({status:'Not on file',date:'',by:'',reason:'',summary:'',checker:'',approver:'',checkedBy:'',approvedBy:'',returnNote:'',file:''});
const addMonths=(key,n)=>{const [y,m]=key.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+n,1));return d.toISOString().slice(0,7);};
const dueOf=(key,dueDay)=>{const nk=addMonths(key,1);return nk+'-'+String(dueDay).padStart(2,'0');};
const monthsBetween=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1);};
const daysUntil=iso=>Math.round((Date.parse(iso)-Date.parse(DAY()))/864e5);

/* ================= Seed ================= */
function seed(){
  const docs=[
    {id:'d1',p:'U100',type:'PID',title:'Pump layout, Unit 100',deleted:false,revs:[
      rev({date:'2026-02-03',summary:'First issue for internal review.',file:'U100-PID-1001_r0.pdf'}),
      rev({date:'2026-04-10',reason:'Client comment',summary:'Moved pump 300 mm north after the site survey.',file:'U100-PID-1001_r1.pdf',checker:'Priya',approver:'Tom',checkedBy:'Priya',approvedBy:'Tom'}),
      rev({status:'Submitted',date:DAY(),by:'Sam',reason:'Design change',summary:'Added a bypass valve on the cooling line.',file:'U100-PID-1001_r2.pdf',checker:'Priya',approver:'Tom'})]},
    {id:'d2',p:'U100',type:'SOP',title:'Unit 100 startup procedure',deleted:false,revs:[
      rev({date:'2026-04-22',summary:'First issue.',file:'U100-SOP-0014_r0.pdf',checker:'Priya',approver:'Tom',checkedBy:'Priya',approvedBy:'Tom'})]},
    {id:'d3',p:'U100',type:'MNT',title:'Monthly pump vibration check',deleted:false,owner:'Mia',dueDay:5,start:'2026-01',periods:{
      '2026-01':{by:'Mia',uploadedAt:'2026-02-03',file:'U100-MNT-0001_2026-01.pdf',summary:'All pumps within limits.'},
      '2026-02':{by:'Mia',uploadedAt:'2026-03-04',file:'U100-MNT-0001_2026-02.pdf',summary:'P-101 bearing noise noted, within limits.'},
      '2026-03':{by:'Mia',uploadedAt:'2026-04-05',file:'U100-MNT-0001_2026-03.pdf',summary:'All pumps within limits.'},
      '2026-04':{by:'Mia',uploadedAt:'2026-05-05',file:'U100-MNT-0001_2026-04.pdf',summary:'All pumps within limits.'},
      '2026-05':{by:'Mia',uploadedAt:'2026-06-05',file:'U100-MNT-0001_2026-05.pdf',summary:'P-102 seal replaced.'},
      '2026-06':{by:'Mia',uploadedAt:'2026-07-05',file:'U100-MNT-0001_2026-06.pdf',summary:'All pumps within limits.'},
      '2026-07':{by:'Mia',uploadedAt:'2026-08-05',file:'U100-MNT-0001_2026-07.pdf',summary:'All pumps within limits.'},
      '2026-08':{by:'Mia',uploadedAt:'2026-09-09',file:'U100-MNT-0001_2026-08.pdf',summary:'Uploaded late. Pump P-103 checked.'}}},
    {id:'d4',p:'U100',type:'RPT',title:'Monthly operations report',deleted:false,owner:'Priya',dueDay:5,start:'2026-01',periods:{
      '2026-01':{by:'Priya',uploadedAt:'2026-02-04',file:'U100-RPT-0001_2026-01.pdf',summary:'January output and downtime summary.'},
      '2026-02':{by:'Priya',uploadedAt:'2026-03-03',file:'U100-RPT-0001_2026-02.pdf',summary:'February output and downtime summary.'},
      '2026-03':{by:'Priya',uploadedAt:'2026-04-02',file:'U100-RPT-0001_2026-03.pdf',summary:'March output and downtime summary.'},
      '2026-04':{by:'Priya',uploadedAt:'2026-05-12',file:'U100-RPT-0001_2026-04.pdf',summary:'April summary. Uploaded late after the audit.'},
      '2026-05':{by:'Priya',uploadedAt:'2026-06-03',file:'U100-RPT-0001_2026-05.pdf',summary:'May output and downtime summary.'},
      '2026-06':{by:'Priya',uploadedAt:'2026-07-03',file:'U100-RPT-0001_2026-06.pdf',summary:'June output and downtime summary.'},
      '2026-07':{by:'Priya',uploadedAt:'2026-08-04',file:'U100-RPT-0001_2026-07.pdf',summary:'July output and downtime summary.'},
      '2026-08':{by:'Priya',uploadedAt:'2026-09-03',file:'U100-RPT-0001_2026-08.pdf',summary:'August output and downtime summary.'},
      '2026-09':{by:'Priya',uploadedAt:'2026-10-02',file:'U100-RPT-0001_2026-09.pdf',summary:'September output and downtime summary.'},
      '2026-10':{by:'Priya',uploadedAt:'2026-11-04',file:'U100-RPT-0001_2026-10.pdf',summary:'October output and downtime summary.'}}},
    {id:'d5',p:'U100',type:'CERT',title:'Pressure vessel V-101 certificate',deleted:false,owner:'Mia',versions:[
      {n:0,by:'Mia',date:'2025-11-28',file:'U100-CERT-0001_v0.pdf',summary:'Certificate issued by inspector.',expiresOn:'2026-11-28'}]},
    {id:'d6',p:'U100',type:'CERT',title:'Fire extinguisher inspection',deleted:false,owner:'Sam',versions:[
      {n:0,by:'Sam',date:'2025-10-30',file:'U100-CERT-0002_v0.pdf',summary:'Annual inspection record.',expiresOn:'2026-10-30'}]},
    {id:'d7',p:'U100',type:'PTW',title:'Hot work permit template',deleted:false,owner:'Sam',versions:[
      {n:0,by:'Sam',date:'2026-03-01',file:'U100-PTW-0001_v0.pdf',summary:'Site permit template, revised for Unit 100.',expiresOn:'2027-06-01'}]},
    {id:'d8',p:'TF7',type:'PID',title:'Tank 7 P&ID',deleted:false,revs:[
      rev({date:'2026-05-12',summary:'Tank 7 issued for review.',file:'TF7-PID-0001_r0.pdf',checker:'Priya',approver:'Tom',checkedBy:'Priya',approvedBy:'Tom'})]}
  ];
  const nums={};
  docs.forEach(d=>{
    const k=d.p+'-'+d.type;nums[k]=(nums[k]||0)+1;
    d.no=`${d.p}-${d.type}-${String(nums[k]).padStart(4,'0')}`;

function statusPill(s){

/* Periodic: state of one period, computed from dates. */
function periodState(d,key){

}
const PSTATE={uploaded:['c-uploaded','Uploaded'],late:['c-late','Late'],missing:['c-missing','Missing'],open:['c-open','Open'],na:['c-na','Not needed'],upcoming:['c-upcoming','']};
/* Record: status from expiry date. */
function recordState(d){

function canReturn(d,i){const r=d.revs[i];if(!['Submitted','Checked'].includes(r.status))return 'This file is not waiting.';if(![r.checker,r.approver].includes(who()))return 'Only the checker or approver can send a file back.';return null;}

/* ================= Validation ================= */
function fileErrors(f,cls){
  const e={};
  if(!f.file)e.file='Choose a file.';
  else if(!/\.(pdf|docx|xlsx|dwg|zip)$/i.test(f.file.name))e.file='This file type is not allowed. Use PDF, Word, Excel, DWG or ZIP.';
  if(!String(f.summary||'').trim()||String(f.summary).trim().length<20)e.summary=`Write at least 20 characters (${String(f.summary||'').trim().length} now).`;
  if(cls==='controlled'){
    if(!f.reason)e.reason='Choose a reason.';
    if((f.note||'').trim().length<10)e.note='Write at least 10 characters for the checker.';
    if(!f.checker)e.checker='Choose a checker.';
    if(!f.approver)e.approver='Choose an approver.';
    if(f.checker&&f.approver&&f.checker===f.approver)e.approver='Approver must be different from the checker.';
    if(f.checker===who())e.checker='You cannot check your own file.';
    if(f.approver===who())e.approver='You cannot approve your own file.';
  }
  if(cls==='record'){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(f.expiresOn||'')||Date.parse(f.expiresOn)<=Date.parse(DAY()))e.expiresOn='Enter the expiry date (after today).';

}

  return prefix+String(max+1).padStart(4,'0');
}
function saveNewDoc(){

function savePeriod(d){

    if(!(f.naReason||'').trim()||f.naReason.trim().length<10)e.naReason='Give a reason of at least 10 characters.';
  } else {
    if(!f.file)e.file='Choose a file.';
    if(!String(f.summary||'').trim()||String(f.summary).trim().length<20)e.summary='Write at least 20 characters.';
    if(d.periods[key]&&!(f.replaceReason||'').trim())e.replaceReason='Say why you are replacing it (10+ characters).';
  }
  S.perr=e;S.ptried=true;
  if(Object.keys(e).length)return;
  const already=!!d.periods[key];

function renderDoc(){

      ${ys.map(k=>{const s=periodState(d,k);const pr=d.periods[k];

          <td>${pr?esc(pr.by):'—'}</td><td class="small">${pr?esc(pr.summary):(s==='na'?'Not needed: '+esc(d.periods[k].naReason):'')}${pr&&pr.replaces&&pr.replaces.length?`<div class="small muted">Replaced ${pr.replaces.length} time(s)</div>`:''}</td></tr>`;}).join('')}
      </tbody></table></div>
      <p class="small muted">Click a row to upload, replace or mark not needed.</p>`;
  } else {
    const v=d.versions.at(-1),r=recordState(d);
    body=`<h2>Current certificate</h2><div class="card"><span class="pill ${RSTATE[r.k][0]}">${RSTATE[r.k][1]}</span>
      <div style="margin-top:8px"><b>Expires</b> ${esc(v.expiresOn)} · ${r.days<0?'expired':r.days+' days left'}</div><div class="rm">${esc(v.file)} · uploaded ${esc(v.date)} by ${esc(v.by)}</div><div style="margin-top:6px">${esc(v.summary)}</div></div>

      <h2>Earlier versions</h2><div class="card">${d.versions.slice(0,-1).reverse().map(x=>`<div class="item"><div><b>Version ${x.n}</b> · expired ${esc(x.expiresOn)}<div class="small muted">${esc(x.summary)} · ${esc(x.by)}</div></div></div>`).join('')||'<span class="muted">None.</span>'}</div>`;
  }

    ?`<div class="warnbox">Removed. The file is renamed to <span class="no">${esc(d.name)}</span>. Nothing was erased.</div><div class="row" style="margin-top:8px"><button class="btn ok" data-a="restore">Restore</button></div>`

      <h3 style="margin-top:14px">Copy this list</h3>
      <pre class="out" id="out">${esc(text)}</pre>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-a="copy">Copy list</button><span class="small muted">If copying is blocked, select the text above and copy it.</span></div>
    </section>`;
}
function renderLog(){
  return `<h1>Activity</h1><p class="sub">Every action, newest first. Nothing here can be edited.</p>
    <div class="card log">${D.log.slice(0,200).map(e=>`<div class="l"><span class="wt">${fmtT(e.t)} · ${esc(e.who)}</span><span>${esc(e.text)}</span></div>`).join('')||'<span class="muted">Nothing yet.</span>'}</div>`;
}
function render(){
  const focus=document.activeElement&&document.activeElement.id;
  const caret=focus&&document.activeElement.selectionStart;
  renderNav();
  let html;
  if(S.view==='dash')html=renderDash();
  else if(S.view==='docs')html=renderDocs();
  else if(S.view==='doc')html=renderDoc();
  else if(S.view==='cal')html=renderCal();
  else if(S.view==='recs')html=renderRecs();
  else if(S.view==='trans')html=renderTrans();
  else html=renderLog();
  $('#main').innerHTML=html;
  let modal='';
  if(S.modal==='add')modal=renderAddModal();
  if(S.modal==='period')modal=renderPeriodModal();
  $('#modalWrap').innerHTML=modal;
  if(focus&&document.getElementById(focus)){const el=document.getElementById(focus);el.focus();if(caret!=null&&el.setSelectionRange)try{el.setSelectionRange(caret,caret);}catch(e){}}
}

/* ================= Events ================= */
const ACT={
  nav:el=>{S.view=el.dataset.v;S.open=null;S.revOpen=false;S.remOpen=false;},
  open:el=>{S.open=el.dataset.id;S.view='doc';S.revOpen=false;S.remOpen=false;S.retText={};},
  'add-open':()=>{S.modal='add';S.draft={};S.errs={};S.tried=false;},
  'modal-close':()=>{S.modal=null;S.mark=null;S.draft={};S.errs={};S.pdraft={};S.perr={};S.ptried=false;},
  'add-save':()=>saveNewDoc(),
  period:el=>{const d=docById(el.dataset.id);const k=el.dataset.k;
    if(periodState(d,k)==='upcoming')return;
    S.mark=k;S.modal='period';S.pdraft={mode:'upload'};S.perr={};S.ptried=false;if(S.view==='doc'||S.view==='cal'){} S.open=d.id;},
  pmode:el=>{S.pdraft.mode=el.dataset.m;},
  'period-save':()=>{const d=docById(S.open);if(d)savePeriod(d);},
  'rev-open':()=>{S.revOpen=true;S.rdraft={};S.rerrs={};S.rtried=false;},
  'rev-close':()=>{S.revOpen=false;S.rdraft={};S.rerrs={};S.rtried=false;},
  'rev-save':()=>saveRev(docById(S.open)),
  'renew-save':()=>saveRenew(docById(S.open)),
  check:el=>doCheck(docById(S.open),+el.dataset.i),
  approve:el=>doApprove(docById(S.open),+el.dataset.i),
  return:el=>doReturn(docById(S.open),+el.dataset.i),
  'rem-open':()=>{S.remOpen=true;},
  'rem-close':()=>{S.remOpen=false;},
  'rem-go':()=>{S.remReason=($('#remR')||{}).value||'';S.remText=($('#remT')||{}).value||'';doRemove(docById(S.open));},
  restore:()=>doRestore(docById(S.open)),
  sel:el=>{const id=el.dataset.id;const i=S.sel.indexOf(id);if(i>=0)S.sel.splice(i,1);else S.sel.push(id);},
  'trans-go':()=>{S.view='trans';},
  copy:()=>{const t=transmittalText();try{navigator.clipboard.writeText(t).then(()=>toast('Copied.'),()=>{selectOut();toast('Copy blocked. The text is selected. Press Ctrl+C.');});}catch(e){selectOut();toast('Copy blocked. The text is selected. Press Ctrl+C.');}},
  reset:()=>{try{localStorage.removeItem(KEY);}catch(e){}D=seed();S.view='dash';S.open=null;S.modal=null;S.sel=[];save();toast('Demo reset.');}
};
function selectOut(){const el=$('#out');if(el){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  if(el.dataset.a==='modal-close'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){ if(el.dataset.a==='sel'){ACT.sel(el);render();} return; }
  if(el.dataset.a==='period'&&el.tagName==='TR'){/* row click */}
  if(el.dataset.a==='open'&&e.target.closest('td[data-stop]'))return;
  const fn=ACT[el.dataset.a];
  if(fn){fn(el);render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){ACT['modal-close']();render();}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='me'){D.me=t.value;S.errs={};save();render();return;}
  if(t.id==='cl'){S.cls=t.value;render();return;}
  if(t.id==='pj'){S.proj=t.value;render();return;}
  if(t.dataset.a==='show-removed'){S.showRemoved=t.checked;render();return;}
  if(t.dataset.pfile){S.pdraft.file=t.files[0]||null;render();return;}
  if(t.dataset.file){const f=t.files[0]||null;if(S.modal==='add')S.draft.file=f;else S.rdraft.file=f;render();return;}
  if(t.dataset.tr){S.trans[t.dataset.tr]=t.value;render();return;}
  if(t.dataset.s&&t.dataset.f){const tgt=t.dataset.s==='add'?S.draft:(t.dataset.s==='pdraft'?S.pdraft:S.rdraft);tgt[t.dataset.f]=t.value;if(t.tagName==='SELECT'||t.type==='date'||t.type==='month')render();return;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.type==='file')return;
  if(t.dataset.tr){S.trans[t.dataset.tr]=t.value;return;}
  if(t.dataset.s&&t.dataset.f){const tgt=t.dataset.s==='add'?S.draft:(t.dataset.s==='pdraft'?S.pdraft:S.rdraft);tgt[t.dataset.f]=t.value;return;}
  if(t.dataset.retext!==undefined){S.retText[t.dataset.retext]=t.value;return;}
  if(t.id==='q'){S.q=t.value;render();return;}
  if(t.id==='remT'){S.remText=t.value;return;}
});
render();
</script>
</body>
</html>
