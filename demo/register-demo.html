<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Document Register Demo</title>
<style>
:root{
  --bg:#f3f1ec;--panel:#fff;--ink:#1c2631;--soft:#5d6874;--line:#e2ded5;--tint:#f4f2ee;
  --navy:#1d3a52;--accent:#1f5f8b;--accent-soft:#e1ecf5;
  --ok:#23734a;--ok-soft:#dff2e7;--warn:#8f5a00;--warn-soft:#fbefd6;--bad:#a02f2f;--bad-soft:#f8e2e2;--mute:#7d8790;--mute-soft:#eceae5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121518;--panel:#1a1f25;--ink:#e6e9ec;--soft:#9aa5b0;--line:#2b333c;--tint:#1e242b;
    --navy:#0f2232;--accent:#7fb3dd;--accent-soft:#1c2c3b;
    --ok:#7fd1a0;--ok-soft:#1b3326;--warn:#f0c270;--warn-soft:#3a2d13;--bad:#f09a9a;--bad-soft:#3b1f1f;--mute:#7d878f;--mute-soft:#262c33;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121518;--panel:#1a1f25;--ink:#e6e9ec;--soft:#9aa5b0;--line:#2b333c;--tint:#1e242b;
  --navy:#0f2232;--accent:#7fb3dd;--accent-soft:#1c2c3b;
  --ok:#7fd1a0;--ok-soft:#1b3326;--warn:#f0c270;--warn-soft:#3a2d13;--bad:#f09a9a;--bad-soft:#3b1f1f;--mute:#7d878f;--mute-soft:#262c33;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:16px;letter-spacing:.01em;margin-right:auto}
.brand small{display:block;font-weight:500;opacity:.75;font-size:12px}
.who{display:flex;gap:8px;align-items:center;font-size:13px;opacity:.95}
.who select{background:#2c4f6b;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 8px}
.who select option{color:#111}
.who .role{opacity:.8;font-size:12px}
.topbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}

/* Layout */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 62px)}
@media (max-width:760px){.shell{grid-template-columns:1fr}.nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.nav h4{display:none}}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px}
.nav button{display:flex;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink);white-space:nowrap}
.nav button:hover{background:var(--tint)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav h4{margin:14px 12px 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
main{padding:22px clamp(16px,3vw,32px) 60px;min-width:0}
h1{font-size:24px;margin:0 0 4px;font-weight:650}
.sub{color:var(--soft);margin:0 0 18px;max-width:70ch}
h2{font-size:17px;margin:26px 0 10px;font-weight:650}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--soft)}
.small{font-size:13px}

/* Controls */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:6px 4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.t,select.t,textarea.t{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);width:100%;font-size:14px}
textarea.t{min-height:70px;resize:vertical}
select.t{width:auto;min-width:160px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:650}
.field .help{font-size:12.5px;color:var(--soft)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:13px;margin-top:2px}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.infobox{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}

/* Pills */
.pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-check{background:var(--accent-soft);color:var(--accent)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-old{background:var(--mute-soft);color:var(--mute)}
.p-none{background:var(--mute-soft);color:var(--soft)}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--soft);margin-left:4px}
.tag.cur{border-color:var(--ok);color:var(--ok);font-weight:650}
.tag.lat{border-color:var(--accent);color:var(--accent);font-weight:650}

/* Tables */
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:650}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--tint)}
tr:last-child td{border-bottom:0}
.no{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--soft)}
.strong{font-weight:650}

/* Revisions */
.rev{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.rev:last-child{padding-bottom:0}
.rev .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--mute);background:var(--panel);margin-top:5px}
.rev.cur .dot{background:var(--ok);border-color:var(--ok)}
.rev.lat .dot{border-color:var(--accent)}
.rev:not(:last-child)::after{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.rev .rt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rev .rm{font-size:13px;color:var(--soft);margin-top:2px}
.rev .rs{margin-top:6px;background:var(--tint);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.rev .ra{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Tasks */
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.task .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task.done .tt{text-decoration:line-through;color:var(--soft)}
.task .tt{font-weight:650}
.task .th{font-size:13px;color:var(--soft)}
.progress{height:8px;background:var(--mute-soft);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .2s}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(15,22,30,.45);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:min(600px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px -24px rgba(0,0,0,.45)}
.modal h3{margin:0 0 12px;font-size:19px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.drop{border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.log{font-size:14px}
.log .l{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.log .l:last-child{border-bottom:0}
.log .wt{color:var(--soft);font-size:13px}
footer{color:var(--soft);font-size:12.5px;margin-top:30px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Document Register<small>Practice demo. Nothing leaves this page.</small></div>
  <div class="who">
    <label for="me">Playing as</label>
    <select id="me" class="t" data-a="me" aria-describedby="meRole"></select>
    <span class="role" id="meRole"></span>
  </div>
  <button class="topbtn" data-a="reset" title="Clear the demo and start again">Start over</button>
</header>

<div class="shell">
  <nav class="nav" aria-label="Sections">
    <h4>Sections</h4>
    <button data-a="nav" data-v="list" aria-current="false">Documents</button>
    <button data-a="nav" data-v="import" aria-current="false">Bring in a list</button>
    <button data-a="nav" data-v="log" aria-current="false">Activity</button>
  </nav>
  <main id="main"></main>
</div>

<div id="modalWrap"></div>
<div id="toastWrap"></div>

<script>
/* ================= Setup ================= */
const KEY='dmsDemo.v2';
const PEOPLE=['Sam','Priya','Tom','Mia'];
const ROLE={Sam:'Adds files',Priya:'Checker',Tom:'Approver',Mia:'Records lead'};
const FOLDERS=['Engineering / Process','Engineering / Piping','Electrical','Operations / Manuals','Operations / SOPs'];
const REASONS=['Design change','Client comment','Vendor data','Error fix','Scope change','As-built'];
const TASKS=[
  {k:'added',t:'Add a new document',h:'Stay as Sam. Use “+ Add document”.'},
  {k:'blocked',t:'Try to check your own file',h:'Open PID-1001 rev 2 as Sam and press Check. The system says no.'},
  {k:'checked',t:'Check a file as Priya',h:'Switch to Priya. Open the same file. Press Check.'},
  {k:'approved',t:'Approve the file as Tom',h:'Switch to Tom. Open the file. Press Approve.'},
  {k:'restored',t:'Remove a document, then restore it',h:'Open any document. Use “Remove”, then “Restore”.'},
  {k:'imported',t:'Bring in a list from a spreadsheet',h:'Open “Bring in a list”. Press “Check the list”, then import.'}
];
const DAY=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmtT=t=>new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

function rev(o){return Object.assign({status:'Approved',date:'2026-02-03',by:'Sam',reason:'Design change',summary:'',checker:'',approver:'',checkedBy:'',approvedBy:'',returnNote:'',file:'',imported:false},o);}
function gap(){return {status:'Not on file',date:'',by:'',reason:'',summary:'',checker:'',approver:'',checkedBy:'',approvedBy:'',returnNote:'',file:'',imported:false};}
function seed(){
  const docs=[
    {id:'d1',no:'PID-1001',title:'Pump layout, Unit 100',folder:'Engineering / Process',deleted:false,orig:'PID-1001.pdf',name:'PID-1001.pdf',revs:[
      rev({date:'2026-02-03',summary:'First issue for internal review.',file:'PID-1001_r0.pdf'}),
      rev({date:'2026-04-10',reason:'Client comment',summary:'Moved pump 300 mm north after the site survey.',file:'PID-1001_r1.pdf',checker:'Priya',approver:'Tom',checkedBy:'Priya',approvedBy:'Tom'}),
      rev({status:'Submitted',date:DAY(),by:'Sam',reason:'Design change',summary:'Added a bypass valve on the cooling line.',file:'PID-1001_r2.pdf',checker:'Priya',approver:'Tom'})]},
    {id:'d2',no:'PIP-0042',title:'Isometric, line 14',folder:'Engineering / Piping',deleted:false,orig:'PIP-0042.pdf',name:'PIP-0042.pdf',revs:[
      rev({date:'2026-01-08',summary:'First issue.',file:'PIP-0042_r0.pdf',checker:'Priya',approver:'Tom',checkedBy:'Priya',approvedBy:'Tom'}),
      rev({date:'2026-06-18',reason:'As-built',summary:'Spool split changed after fit-up.',file:'PIP-0042_r1.pdf',checker:'Priya',approver:'Tom',checkedBy:'Priya',approvedBy:'Tom'})]},
    {id:'d3',no:'MAN-0007',title:'Pump maintenance manual',folder:'Operations / Manuals',deleted:false,orig:'MAN-0007.pdf',name:'MAN-0007.pdf',revs:[
      rev({date:'2026-03-02',reason:'Vendor data',summary:'Vendor manual adapted for site.',file:'MAN-0007_r0.pdf'})]},
    {id:'d4',no:'SOP-0014',title:'Unit 100 startup procedure',folder:'Operations / SOPs',deleted:false,orig:'SOP-0014.pdf',name:'SOP-0014.pdf',revs:[
      rev({date:'2026-04-22',summary:'First issue.',file:'SOP-0014_r0.pdf'}),
      gap(),
      rev({date:'2026-10-05',reason:'Error fix',summary:'Added nitrogen purge step.',file:'SOP-0014_r2.pdf'})]},
    {id:'d5',no:'ELE-0300',title:'Single line diagram',folder:'Electrical',deleted:false,orig:'ELE-0300.pdf',name:'ELE-0300.pdf',revs:[
      rev({status:'Returned',date:'2026-09-02',by:'Sam',reason:'Design change',summary:'First draft of the main supply.',file:'ELE-0300_r0.pdf',checker:'Priya',approver:'Tom',returnNote:'Load list is missing. Please add it, then resubmit.'})]}
  ];
  const log=[
    {t:Date.parse('2026-02-03T09:00'),who:'Sam',text:'Added PID-1001 rev 0'},
    {t:Date.parse('2026-04-10T14:20'),who:'Tom',text:'Approved PID-1001 rev 1 (now current)'},
    {t:Date.parse('2026-06-18T11:05'),who:'Tom',text:'Approved PIP-0042 rev 1 (now current)'},
    {t:Date.parse('2026-10-05T10:40'),who:'Sam',text:'Added SOP-0014 rev 2'}
  ];
  return {me:'Sam',docs,log,progress:{},hideTasks:false};
}
function load(){
  try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.docs)return v;}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}

/* ================= State ================= */
let D=load();
const S={view:'list',open:null,q:'',status:'',showRemoved:false,modal:null,
  draft:{},errs:{},tried:false,revOpen:false,rdraft:{},rerrs:{},retText:{},remReason:'',remText:'',remOpen:false,
  imp:{text:SAMPLE_CSV()},impRows:null,toast:'',toastT:null};
function SAMPLE_CSV(){return `doc_no,title,rev,date,folder,summary,file_name,by
pid 1002,Pump P-101 datasheet,0,2026-03-01,Engineering / Process,First issue for review,PID-1002_r0.pdf,Sam
PID-1002,Pump P-101 datasheet,2,2026-06-10,Engineering / Process,Vendor data added,PID-1002_r2.pdf,Sam
PIP-0042,Isometric line 14,0,2026-01-08,Engineering / Piping,Already in the register,PIP-0042_r0.pdf,Sam
ELE-0301,Cable schedule,0,2026-05-20,Electrical,First issue for review,ELE-0301_r0.pdf,Mia`;}

/* ================= Rules and helpers ================= */
const curIdx=d=>{let c=-1;d.revs.forEach((r,i)=>{if(r.status==='Approved')c=i;});return c;};
const lastIdx=d=>d.revs.length-1;
const docById=id=>D.docs.find(d=>d.id===id);
const cleanNo=s=>(s||'').trim().toUpperCase().replace(/\s+/g,'-');
const NO_OK=s=>/^[A-Z]{2,6}-\d{3,5}$/.test(s);
const who=()=>D.me;
function log(text){D.log.unshift({t:Date.now(),who:D.me,text});}
function prog(k){D.progress[k]=true;}
function toast(m){clearTimeout(S.toastT);S.toast=m;$('#toastWrap').innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;S.toastT=setTimeout(()=>{$('#toastWrap').innerHTML='';},4200);}
function statusPill(s){
  const map={'Submitted':['p-wait','Waiting for check'],'Checked':['p-check','Waiting for approval'],'Approved':['p-ok','Approved'],'Returned':['p-bad','Sent back'],'Not on file':['p-none','Not on file']};
  const [c,t]=map[s]||['p-none',s];return `<span class="pill ${c}">${t}</span>`;
}
function revTags(d,i){
  const r=d.revs[i];if(r.status==='Not on file')return '';
  const c=curIdx(d),l=lastIdx(d);let h='';
  if(i===c)h+='<span class="tag cur">Current</span>';
  if(i===l)h+='<span class="tag lat">Latest</span>';
  if(i<l&&c>=0&&i<c)h+='<span class="tag">Replaced</span>';
  return h;
}
/* Rules shown as messages. Return null if allowed. */
function canCheck(d,i){
  const r=d.revs[i];
  if(r.status!=='Submitted')return 'This file is not waiting for a check.';
  if(who()===r.by)return 'You added this file, so you cannot check it. Ask a different checker.';
  if(who()!==r.checker)return `Only ${r.checker} can check this file.`;
  return null;
}
function canApprove(d,i){
  const r=d.revs[i];
  if(r.status!=='Checked')return 'This file is not waiting for approval.';
  if(who()===r.by||who()===r.checker)return 'The approver must be a different person from the uploader and the checker.';
  if(who()!==r.approver)return `Only ${r.approver} can approve this file.`;
  return null;
}
function canReturn(d,i){
  const r=d.revs[i];
  if(!['Submitted','Checked'].includes(r.status))return 'This file is not waiting.';
  if(![r.checker,r.approver].includes(who()))return 'Only the checker or approver can send a file back.';
  return null;
}
/* Validation for a new file (document or version). */
function fileErrors(f){
  const e={};
  if(!f.file)e.file='Choose a file.';
  else if(!/\.(pdf|docx|xlsx|dwg|zip)$/i.test(f.file.name))e.file='This file type is not allowed. Use PDF, Word, Excel, DWG or ZIP.';
  if(!f.reason)e.reason='Choose a reason.';
  const s=(f.summary||'').trim();
  if(s.length<20)e.summary=`Write at least 20 characters (${s.length} now).`;
  if((f.note||'').trim().length<10)e.note='Write at least 10 characters for the checker.';
  if(!f.checker)e.checker='Choose a checker.';
  if(!f.approver)e.approver='Choose an approver.';
  if(f.checker&&f.approver&&f.checker===f.approver)e.approver='Approver must be different from the checker.';
  if(f.checker&&f.checker===who())e.checker='You cannot be the checker for your own file.';
  if(f.approver&&(f.approver===who()))e.approver='You cannot approve your own file.';
  return e;
}

/* ================= Actions ================= */
function addRevision(d,f){
  const idx=d.revs.length;
  d.revs.push(rev({status:'Submitted',date:DAY(),by:who(),reason:f.reason,summary:f.summary.trim(),file:f.file.name,checker:f.checker,approver:f.approver}));
  log(`Added ${d.no} rev ${idx} (waiting for check by ${f.checker})`);
  return idx;
}
function saveNewDoc(){
  const f=S.draft;const e=fileErrors(f);
  const no=cleanNo(f.no),title=(f.title||'').trim(),folder=f.folder;
  if(!NO_OK(no))e.no='Use a code like PID-1001 (letters, dash, digits).';
  else if(D.docs.some(d=>d.no===no))e.no=`${no} is already in the register.`;
  if(!title)e.title='Give the document a title.';
  if(!folder)e.folder='Choose a folder.';
  S.errs=e;S.tried=true;
  if(Object.keys(e).length)return false;
  const d={id:'d'+Date.now().toString(36),no,title,folder,deleted:false,orig:no+'.pdf',name:no+'.pdf',revs:[]};
  D.docs.push(d);
  addRevision(d,f);
  log(`Created document ${no} · ${title}`);
  prog('added');save();
  S.open=d.id;S.view='doc';S.modal=null;S.draft={};S.errs={};S.tried=false;
  toast(`${no} added. Waiting for ${f.checker} to check it.`);
  return true;
}
function saveRev(d){
  const f=S.rdraft;const e=fileErrors(f);
  S.rerrs=e;S.tried2=true;
  if(Object.keys(e).length)return;
  const idx=addRevision(d,f);
  S.rdraft={};S.rerrs={};S.tried2=false;S.revOpen=false;
  save();toast(`Rev ${idx} added. Waiting for ${f.checker}.`);
}
function doCheck(d,i){
  const m=canCheck(d,i);
  if(m){if(who()===d.revs[i].by)prog('blocked');save();toast(m);return;}
  d.revs[i].status='Checked';d.revs[i].checkedBy=who();
  log(`Checked ${d.no} rev ${i}`);prog('checked');save();
  toast(`Checked. Waiting for ${d.revs[i].approver} to approve.`);
}
function doApprove(d,i){
  const m=canApprove(d,i);
  if(m){save();toast(m);return;}
  d.revs[i].status='Approved';d.revs[i].approvedBy=who();
  log(`Approved ${d.no} rev ${i} (now current)`);prog('approved');save();
  toast(`Approved. ${d.no} rev ${i} is now the current version.`);
}
function doReturn(d,i){
  const m=canReturn(d,i);
  const t=(S.retText[i]||'').trim();
  if(m){toast(m);return;}
  if(t.length<10){toast('Write at least 10 characters to explain what must change.');return;}
  d.revs[i].status='Returned';d.revs[i].returnNote=t;
  log(`Sent back ${d.no} rev ${i}: ${t}`);save();
  S.retText[i]='';toast('Sent back to the uploader with your note.');
}
function doRemove(d){
  const r=S.remReason,t=(S.remText||'').trim();
  if(!r){toast('Choose a reason.');return;}
  if(t.length<20){toast('Write at least 20 characters to say why.');return;}
  d.deleted=true;d.name='DELETED_'+DAY().replace(/-/g,'')+'_'+d.orig;
  log(`Removed ${d.no} (${r}): ${t}. Renamed to ${d.name}`);prog('removed');save();
  S.remOpen=false;S.remReason='';S.remText='';toast(`${d.no} is removed. The file is renamed, not erased.`);
}
function doRestore(d){
  d.deleted=false;d.name=d.orig;log(`Restored ${d.no}. Name set back to ${d.orig}`);prog('restored');save();
  toast(`${d.no} is back in the register.`);
}
/* CSV: one row per revision. Simple parsing (no quoted commas). */
function parseList(text){
  const lines=text.trim().split(/\r?\n/).filter(Boolean);
  const head=(lines[0]||'').split(',').map(s=>s.trim().toLowerCase());
  const need=['doc_no','title','rev','date','folder','summary','file_name','by'];
  const miss=need.filter(c=>!head.includes(c));
  if(miss.length)return {error:`The list needs these columns: ${miss.join(', ')}`,rows:[]};
  const rows=lines.slice(1).map((ln,i)=>{
    const c=ln.split(',').map(s=>s.trim());const g=k=>c[head.indexOf(k)]??'';
    const raw=g('doc_no'),no=cleanNo(raw),rv=g('rev');
    const issues=[];
    if(raw!==no)issues.push({k:'info',m:`Name fixed to ${no}`});
    if(!NO_OK(no))issues.push({k:'block',m:'Number format is wrong'});
    if(!/^\d+$/.test(rv))issues.push({k:'block',m:'Rev must be a number'});
    if(!FOLDERS.includes(g('folder')))issues.push({k:'block',m:'Folder is not in the list'});
    if(!g('file_name'))issues.push({k:'block',m:'File name missing'});
    if(!PEOPLE.includes(g('by')))issues.push({k:'block',m:'“By” must be a person in the demo'});
    const d=D.docs.find(x=>x.no===no);
    if(d&&d.revs[+rv]&&d.revs[+rv].status!=='Not on file')issues.push({k:'skip',m:`Rev ${rv} is already on file. Skipped.`});
    if(d&&+rv>d.revs.length)issues.push({k:'info',m:`Rev ${d.revs.length} to ${+rv-1} will show as Not on file`});
    if(!d&&+rv>0)issues.push({k:'info',m:`Rev 0 to ${+rv-1} will show as Not on file`});
    return {L:i+2,no,title:g('title'),rev:+rv,date:g('date'),folder:g('folder'),summary:g('summary'),file:g('file_name'),by:g('by'),issues};
  });
  return {rows};
}
function runImport(rp){
  let added=0,skipped=0;
  rp.rows.forEach(r=>{
    if(r.issues.some(i=>i.k==='block')||r.issues.some(i=>i.k==='skip')){skipped++;return;}
    let d=D.docs.find(x=>x.no===r.no);
    if(!d){d={id:'d'+Date.now().toString(36)+r.L,no:r.no,title:r.title,folder:r.folder,deleted:false,orig:r.no+'.pdf',name:r.no+'.pdf',revs:[]};D.docs.push(d);}
    while(d.revs.length<r.rev)d.revs.push(gap());
    d.revs[r.rev]=rev({status:'Approved',date:r.date,by:r.by,reason:'Historical import',summary:r.summary,file:r.file,imported:true});
    log(`Imported ${d.no} rev ${r.rev} from list`);added++;
  });
  prog('imported');save();
  return {added,skipped};
}

function renderDoc(){
  const d=docById(S.open);
  if(!d){S.view='list';return renderList();}
  const c=curIdx(d),l=lastIdx(d);
  const cur=c>=0?d.revs[c]:null;
  let revs='';
  for(let i=l;i>=0;i--){
    const r=d.revs[i];
    if(r.status==='Not on file'){
      revs+=`<div class="rev"><div class="dot"></div><div><div class="rt"><span class="strong">Rev ${i}</span>${statusPill(r.status)}</div><div class="rm">This version is missing from the old records. It cannot be current.</div></div></div>`;
      continue;
    }
    const cls=i===c?'cur':(i===l?'lat':'');
    let acts='';
    if(r.status==='Submitted'){
      acts+=`<button class="btn ok" data-a="check" data-i="${i}">Check</button>`;
    }
    if(r.status==='Checked'){
      acts+=`<button class="btn ok" data-a="approve" data-i="${i}">Approve</button>`;
    }
    if(['Submitted','Checked'].includes(r.status)){
      acts+=`<button class="btn danger" data-a="return" data-i="${i}">Send back</button>`;
      acts+=`<input class="t" style="max-width:360px;flex:1" data-retext="${i}" placeholder="Why? (10+ characters, shown to uploader)" value="${esc(S.retText[i]||'')}" aria-label="Reason for sending back rev ${i}">`;
    }
    revs+=`<div class="rev ${cls}"><div class="dot"></div><div>
      <div class="rt"><span class="strong">Rev ${i}</span>${statusPill(r.status)}${revTags(d,i)}</div>
      <div class="rm">${r.date} · added by ${esc(r.by)}${r.reason?' · '+esc(r.reason):''}${r.imported?' · imported':''}</div>
      <div class="rs">${esc(r.summary)||'<span class="muted">No summary</span>'}</div>
      ${r.file?`<div class="rm">File: ${esc(r.file)}</div>`:''}
      ${r.checker?`<div class="rm">Checker: ${esc(r.checker)}${r.checkedBy?' (done)':''} · Approver: ${esc(r.approver)}${r.approvedBy?' (done)':''}</div>`:''}

  const remove=d.deleted
    ?`<div class="warnbox">This document is removed. Its file is renamed to <span class="no">${esc(d.name)}</span>. Nothing was erased.</div>

    :(S.remOpen?renderRemoveForm(d):`<button class="btn danger" data-a="rem-open">Remove document</button>`);

  return `<button class="btn link" data-a="nav" data-v="list" style="padding-left:0">← All documents</button>
    <h1 style="margin-top:6px">${esc(d.title)}</h1>
    <p class="sub"><span class="no">${esc(d.no)}</span> · ${esc(d.folder)}${d.deleted?' · <span class="pill p-bad">Removed</span>':''}</p>
    ${newestWaiting&&!d.deleted&&c>=0?`<div class="infobox">Latest version is waiting. Current stays as Rev ${c} until it is approved.</div>`:''}
    ${newestWaiting&&!d.deleted&&c<0?`<div class="infobox">No version is approved yet. The first approval makes it current.</div>`:''}
    <div class="two" style="grid-template-columns:1fr 1fr;margin-bottom:6px">
      <section class="card"><div class="muted small">Current version (in use)</div>
        ${cur?`<div class="strong" style="font-size:18px;margin-top:4px">Rev ${c}</div><div style="margin-top:6px">${esc(cur.summary)}</div><div class="small muted" style="margin-top:6px">Approved by ${esc(cur.approvedBy||'—')}</div>`:'<div style="margin-top:6px" class="muted">No approved version yet.</div>'}
      </section>
      <section class="card"><div class="muted small">Latest version</div>
        <div class="strong" style="font-size:18px;margin-top:4px">Rev ${l} ${statusPill(d.revs[l].status)}</div>
        <div style="margin-top:6px">${esc(d.revs[l].summary)||'<span class="muted">No summary</span>'}</div>
      </section>
    </div>
    <h2>History</h2>
    <div class="card">${revs}</div>

    ${addRev}

    <div class="row">${remove}</div>
    <h2>Recent activity</h2>
    <div class="card log">${log2.length?log2.map(e=>`<div class="l"><span class="wt">${fmtT(e.t)} · ${esc(e.who)}</span><span>${esc(e.text)}</span></div>`).join(''):'<span class="muted">Nothing yet.</span>'}</div>`;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  if(el.dataset.a==='modal-close'&&e.target.closest('[data-stop]')&&e.target.dataset.a!=='modal-close'&&!e.target.closest('button'))return;
  if(el.tagName==='INPUT'&&el.type==='checkbox')return;
  const fn=ACT[el.dataset.a];
  if(fn){fn(el);render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('tr[data-a="open"]')){ACT.open(e.target);render();}
  if(e.key==='Escape'&&S.modal){ACT['modal-close']();render();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='me'){D.me=t.value;S.errs={};save();render();return;}
  if(t.id==='st'){S.status=t.value;render();return;}
  if(t.dataset.a==='show-removed'){S.showRemoved=t.checked;render();return;}
  if(t.dataset.file){const scope=t.dataset.s;const f=t.files[0]||null;(scope==='add'?S.draft:S.rdraft).file=f;render();return;}
  if(t.dataset.s&&t.dataset.f){(t.dataset.s==='add'?S.draft:S.rdraft)[t.dataset.f]=t.value;if(t.tagName==='SELECT')render();return;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.type==='file')return;
  if(t.dataset.s&&t.dataset.f){(t.dataset.s==='add'?S.draft:S.rdraft)[t.dataset.f]=t.value;return;}
  if(t.dataset.retext!==undefined){S.retText[t.dataset.retext]=t.value;return;}
  if(t.id==='q'){S.q=t.value;render();return;}
  if(t.id==='remT'){S.remText=t.value;return;}
  if(t.id==='impT'){S.imp.text=t.value;return;}
});
render();
</script>
</body>
</html>
